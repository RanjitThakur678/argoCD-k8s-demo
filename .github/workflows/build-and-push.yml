name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/build-and-push.yml"

permissions:
  id-token: write # required for OIDC -> AWS role assumption, no static AWS keys stored in this repo
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev # required: AWS_GITHUB_ACTIONS_ROLE_ARN etc. are environment-scoped variables, not repo-level
    strategy:
      matrix:
        service: [frontend, middleware, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd services/${{ matrix.service }}
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
