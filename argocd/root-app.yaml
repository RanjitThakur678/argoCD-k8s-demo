# App-of-Apps root: this is the one Application you apply by hand after installing Argo CD.
# It manages every other Application (ecom, monitoring, ...) declared under argocd/apps/ - add a
# new file there and this root app picks it up automatically on the next sync, no extra kubectl needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/RanjitThakur678/argoCD-k8s-demo.git
    targetRevision: main
    path: argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
