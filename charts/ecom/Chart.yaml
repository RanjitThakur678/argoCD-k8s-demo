apiVersion: v2
name: ecom
description: Three-tier ecommerce app (React frontend, FastAPI middleware, Go backend) with Postgres + Redis, deployed via Argo CD.
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "15.5.20"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.6.4"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
