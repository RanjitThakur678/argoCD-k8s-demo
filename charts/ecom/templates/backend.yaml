apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom.fullname" . }}-backend
  labels:
    app: {{ include "ecom.fullname" . }}-backend
    {{- include "ecom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ecom.fullname" . }}-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ include "ecom.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: {{ include "ecom.databaseURL" . | quote }}
            - name: REDIS_ADDR
              value: {{ include "ecom.redisAddr" . | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecom.fullname" . }}-backend
  labels:
    {{- include "ecom.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "ecom.fullname" . }}-backend
  ports:
    - port: 8080
      targetPort: 8080
