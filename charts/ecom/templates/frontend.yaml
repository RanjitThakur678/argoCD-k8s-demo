apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom.fullname" . }}-frontend
  labels:
    app: {{ include "ecom.fullname" . }}-frontend
    {{- include "ecom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ecom.fullname" . }}-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ include "ecom.fullname" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecom.fullname" . }}-frontend
  labels:
    {{- include "ecom.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "ecom.fullname" . }}-frontend
  ports:
    - port: 80
      targetPort: 80
