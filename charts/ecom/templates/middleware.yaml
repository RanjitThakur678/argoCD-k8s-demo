apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecom.fullname" . }}-middleware
  labels:
    app: {{ include "ecom.fullname" . }}-middleware
    {{- include "ecom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.middleware.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ecom.fullname" . }}-middleware
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ include "ecom.fullname" . }}-middleware
    spec:
      containers:
        - name: middleware
          image: "{{ .Values.middleware.image.repository }}:{{ .Values.middleware.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_URL
              value: "http://{{ include "ecom.fullname" . }}-backend:8080"
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.middleware.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecom.fullname" . }}-middleware
  labels:
    {{- include "ecom.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "ecom.fullname" . }}-middleware
  ports:
    - port: 8000
      targetPort: 8000
